notes:
  - Mattermost separates Go application servers, PostgreSQL message stores, S3-compatible file storage, and 1:2 compute-optimized `rtcd` voice/screen WebRTC media nodes above 1,000 concurrent users.
  - PostgreSQL read replicas and dedicated OpenSearch/Elasticsearch clusters absorb full-text message search load on 10,000+ seat deployments.
disclaimers:
  - Based on Mattermost 10.x Enterprise scaling guidelines for Go app servers, PostgreSQL, Calls `rtcd` services, and object storage attachments.
  - Estimate excludes Mattermost Enterprise/Professional seat subscriptions, mobile push proxy hosting, and WebRTC UDP egress bandwidth.

