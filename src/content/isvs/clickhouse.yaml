slug: clickhouse
name: ClickHouse Self-Managed
vendor: ClickHouse, Inc.
category: observability
arch_support:
  - x86_64
  - arm64
description: >
  Self-managed ClickHouse columnar OLAP and observability analytics cluster with ClickHouse Keeper coordination.
ref_arch:
  source_url: https://clickhouse.com/docs/en/operations/tips
  version: "ClickHouse production sizing & ClickHouse Keeper quorum guidance"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: up to 2 TB compressed analytical or log data on a single shard
    ref_arch_tier: single-shard-starter
    components:
      - role: clickhouse-server
        count: 1
        vcpu: 8
        memory_gb: 32
        storage_gb: 2000
        storage_type: ssd
    ha_components:
      - role: clickhouse-replica
        count: 1
        vcpu: 8
        memory_gb: 32
        storage_gb: 2000
        storage_type: ssd
      - role: clickhouse-keeper
        count: 3
        vcpu: 2
        memory_gb: 8
        storage_gb: 50
        storage_type: nvme
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
  m:
    label: Medium
    range_description: 2 to 15 TB compressed data across two replicated shards
    ref_arch_tier: two-shard-replicated
    components:
      - role: clickhouse-server
        count: 2
        vcpu: 16
        memory_gb: 64
        storage_gb: 4000
        storage_type: ssd
      - role: clickhouse-keeper
        count: 3
        vcpu: 4
        memory_gb: 8
        storage_gb: 100
        storage_type: nvme
    ha_components:
      - role: clickhouse-replica
        count: 2
        vcpu: 16
        memory_gb: 64
        storage_gb: 4000
        storage_type: ssd
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
  xl:
    label: Extra Large
    range_description: 15 to 100 TB compressed analytical or OpenTelemetry observability data
    ref_arch_tier: four-shard-replicated
    components:
      - role: clickhouse-server
        count: 4
        vcpu: 32
        memory_gb: 128
        storage_gb: 8000
        storage_type: nvme
      - role: clickhouse-keeper
        count: 3
        vcpu: 4
        memory_gb: 16
        storage_gb: 200
        storage_type: nvme
      - role: object-storage
        count: 1
        vcpu: 0
        memory_gb: 0
        storage_gb: 30000
        storage_type: object
    ha_components:
      - role: clickhouse-replica
        count: 4
        vcpu: 32
        memory_gb: 128
        storage_gb: 8000
        storage_type: nvme
      - role: load-balancer
        count: 2
        vcpu: 0
        memory_gb: 0
notes:
  - Dedicated 3-node ClickHouse Keeper Raft quorums replace Apache ZooKeeper for ReplicatedMergeTree coordination in modern ClickHouse deployments.
  - Extra Large includes tiered S3/GCS/Blob object storage alongside hot NVMe disks for cold-tier MergeTree partitions, and ClickHouse runs natively with high throughput on Linux arm64 CPUs.
disclaimers:
  - Based on ClickHouse self-managed operational sizing tips (1:4 CPU-to-RAM ratio and dedicated Keeper quorums).
  - Estimate excludes OpenTelemetry collector fleets, Kafka/Vector ingestion pipelines, backup buckets, and cross-AZ replication egress.

