notes:
  - Atlassian ended Confluence Data Center sales to new customers on March 30, 2026; license expansions for existing customers end March 30, 2028 ahead of full Data Center end of life on March 28, 2029.
  - Confluence Data Center 9.x pairs clustered application and Synchrony nodes with shared-home storage and optional external OpenSearch at Extra Large scale.
disclaimers:
  - Based on Atlassian Confluence Data Center 9.x load profiles and enterprise architecture guidance, normalized to VM-backed compute and storage tiers.
  - Estimate excludes Atlassian Data Center licensing, Marketplace plugins, backup snapshots, and Cloud migration staging environments.

