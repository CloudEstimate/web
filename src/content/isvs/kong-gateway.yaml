slug: kong-gateway
name: Kong Gateway
vendor: Kong Inc.
category: other
arch_support:
  - x86_64
  - arm64
description: >
  Self-managed Kong Gateway 3.x LTS for high-throughput API ingress, AI gateway routing, and policy enforcement.
ref_arch:
  source_url: https://developer.konghq.com/gateway/resource-sizing-guidelines/
  version: "Kong Gateway 3.x LTS resource sizing guidelines"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: under 1,000 configured entities and under 2,500 requests per second
    ref_arch_tier: small
    components:
      - role: gateway
        count: 1
        vcpu: 2
        memory_gb: 4
        storage_gb: 50
        storage_type: ssd
      - role: database
        count: 1
        vcpu: 2
        memory_gb: 8
        storage_gb: 100
        storage_type: ssd
    ha_components:
      - role: gateway
        count: 1
        vcpu: 2
        memory_gb: 4
        storage_gb: 50
        storage_type: ssd
      - role: database-replica
        count: 1
        vcpu: 2
        memory_gb: 8
        storage_gb: 100
        storage_type: ssd
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
  m:
    label: Medium
    range_description: under 10,000 configured entities and up to 10,000 requests per second
    ref_arch_tier: medium
    components:
      - role: gateway
        count: 2
        vcpu: 4
        memory_gb: 8
        storage_gb: 100
        storage_type: ssd
      - role: database
        count: 1
        vcpu: 4
        memory_gb: 16
        storage_gb: 200
        storage_type: ssd
    ha_components:
      - role: gateway
        count: 1
        vcpu: 4
        memory_gb: 8
        storage_gb: 100
        storage_type: ssd
      - role: database-replica
        count: 1
        vcpu: 4
        memory_gb: 16
        storage_gb: 200
        storage_type: ssd
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
  xl:
    label: Extra Large
    range_description: 10,000 to 50,000+ configured entities in a central production API gateway cluster
    ref_arch_tier: large
    components:
      - role: gateway
        count: 4
        vcpu: 8
        memory_gb: 16
        storage_gb: 100
        storage_type: ssd
      - role: database
        count: 1
        vcpu: 8
        memory_gb: 32
        storage_gb: 300
        storage_type: ssd
    ha_components:
      - role: gateway
        count: 2
        vcpu: 8
        memory_gb: 16
        storage_gb: 100
        storage_type: ssd
      - role: database-replica
        count: 1
        vcpu: 8
        memory_gb: 32
        storage_gb: 300
        storage_type: ssd
      - role: load-balancer
        count: 2
        vcpu: 0
        memory_gb: 0
notes:
  - Gateway data-plane nodes map cleanly to 1:2 compute-optimized shapes (and Linux arm64 instances) because NGINX/OpenResty proxy workers are CPU-bound rather than memory-bound.
  - DB-less declarative mode eliminates the PostgreSQL tier when configuration is pushed via GitOps or control-plane sync.
disclaimers:
  - Based on Kong Gateway 3.x LTS resource sizing guidelines paired with a conservative self-managed PostgreSQL control-plane store.
  - Estimate excludes Kong Enterprise / Konnect licensing, Redis rate-limiting clusters, Developer Portal hosts, and L7 data-processing charges.
