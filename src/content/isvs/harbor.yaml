notes:
  - Offloading immutable OCI image layers and AI model weights to native S3/GCS/Azure Blob object storage keeps Harbor registry pods stateless and avoids resizing block volumes.
  - Concurrent Trivy vulnerability scans and PostgreSQL manifest metadata queries drive CPU and RAM sizing during peak CI/CD build storms.
disclaimers:
  - Based on Harbor hardware prerequisites and HA Helm architecture separating Harbor Core/Registry, Trivy scanners, PostgreSQL, Valkey/Redis, and cloud object storage.
  - Estimate excludes cross-region replication egress, CDN layer caching, and P2P Dragonfly/Kraken node agents.
