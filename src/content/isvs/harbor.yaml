slug: harbor
name: Harbor Registry
vendor: CNCF / Harbor Project
category: artifact-repo
arch_support:
  - x86_64
  - arm64
description: >
  CNCF graduated open-source OCI container, Helm chart, and AI model artifact registry (Apache 2.0) with RBAC, vulnerability scanning, and multi-site replication.
ref_arch:
  source_url: https://goharbor.io/docs/latest/install-config/installation-prereqs/
  version: "Harbor 2.12+ installation prerequisites & HA architecture"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: small platform team registry storing 1 TB of container images and Helm charts
    ref_arch_tier: single-node-compose
    components:
