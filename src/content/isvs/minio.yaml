slug: minio
name: MinIO
vendor: MinIO, Inc.
category: data-store
arch_support:
  - x86_64
  - arm64
description: >
  Self-managed MinIO / AIStor S3-compatible object storage for data lakes, AI training repositories, and blob storage.
ref_arch:
  source_url: https://min.io/docs/minio/linux/operations/installation.html
  version: "MinIO / AIStor erasure-coded reference topologies (post-Feb 2026 CE archive)"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: up to 20 TB usable capacity on a single multi-drive node
    ref_arch_tier: single-node-multi-drive
    components:
      - role: storage-node
        count: 1
        vcpu: 8
        memory_gb: 32
        storage_gb: 24000
        storage_type: nvme
    ha_components:
      - role: storage-node
        count: 3
        vcpu: 8
        memory_gb: 32
        storage_gb: 24000
        storage_type: nvme
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
  m:
    label: Medium
    range_description: 20 to 100 TB usable capacity on a four-node erasure-coded cluster
    ref_arch_tier: four-node-erasure-coded
    components:
      - role: storage-node
        count: 4
        vcpu: 16
        memory_gb: 64
        storage_gb: 30000
        storage_type: nvme
    ha_components:
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
  xl:
    label: Extra Large
    range_description: 100 TB to 1 PiB usable capacity on an eight-node erasure-coded cluster
    ref_arch_tier: eight-node-erasure-coded
    components:
      - role: storage-node
        count: 8
        vcpu: 32
        memory_gb: 128
        storage_gb: 30000
        storage_type: nvme
    ha_components:
      - role: load-balancer
        count: 2
        vcpu: 0
        memory_gb: 0
notes:
  - MinIO archived the open-source minio/minio Community Edition repository in February 2026 after ending prebuilt community binary releases in October 2025; new supported deployments require commercial MinIO AIStor licensing or an open-source alternative such as SeaweedFS.
  - Production-oriented deployments start at a four-node erasure-coded layout, so the HA toggle expands the Extra Small tier into four storage nodes and adds managed load balancing on larger tiers.
disclaimers:
  - Based on MinIO erasure-coded deployment topologies and public reference hardware guidance, translated into VM-based object-storage planning tiers.
  - Estimate excludes commercial AIStor subscription fees, raw-to-usable parity overhead, cross-site replication, and high-bandwidth egress charges.

