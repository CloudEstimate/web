notes:
  - Atlassian ended Jira Data Center sales to new customers on March 30, 2026; existing customer license expansions close March 30, 2028 ahead of full Data Center end of life (read-only mode) on March 28, 2029.
  - Jira Data Center 10.x supports external OpenSearch indexing on Extra Large estates and requires shared-home NFS/filestore plus PostgreSQL/Aurora-class database storage.
disclaimers:
  - Based on Atlassian Jira Data Center 10.x size profiles and AWS deployment guidance, normalized to VM-backed compute and storage baselines.
  - Estimate excludes Atlassian Data Center subscription renewals, Marketplace apps, Cloud migration tooling, and external CDN or WAF layers.

