slug: apache-kafka-confluent-platform
name: Apache Kafka via Confluent Platform
vendor: Confluent, Inc.
category: streaming
arch_support:
  - x86_64
  - arm64
description: >
  Self-managed Confluent Platform 8.x (Apache Kafka 4.x KRaft) for durable event streaming, schema governance, and Connect pipelines.
ref_arch:
  source_url: https://docs.confluent.io/platform/current/kafka/deployment.html
  version: "Confluent Platform 8.x (Apache Kafka 4.x KRaft-only)"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: up to 50 MB/s ingress with short local retention windows
    ref_arch_tier: departmental-cluster
    components:
      - role: broker
        count: 3
        vcpu: 8
        memory_gb: 32
        storage_gb: 2000
        storage_type: ssd
      - role: kraft-controller
        count: 3
        vcpu: 2
        memory_gb: 8
        storage_gb: 100
        storage_type: ssd
      - role: connect
        count: 2
        vcpu: 2
        memory_gb: 8
        storage_gb: 50
        storage_type: ssd
      - role: schema-registry
        count: 2
        vcpu: 2
        memory_gb: 8
        storage_gb: 50
        storage_type: ssd
      - role: control-center
        count: 1
        vcpu: 4
        memory_gb: 16
        storage_gb: 300
        storage_type: ssd
  m:
    label: Medium
    range_description: 50 to 150 MB/s ingress or larger retained topic footprints
    ref_arch_tier: regional-cluster
    components:
      - role: broker
        count: 4
        vcpu: 16
        memory_gb: 64
        storage_gb: 4000
        storage_type: ssd
      - role: kraft-controller
        count: 3
        vcpu: 4
        memory_gb: 16
        storage_gb: 100
        storage_type: ssd
      - role: connect
        count: 2
        vcpu: 4
        memory_gb: 16
        storage_gb: 100
        storage_type: ssd
      - role: schema-registry
        count: 2
        vcpu: 2
        memory_gb: 8
        storage_gb: 50
        storage_type: ssd
      - role: control-center
        count: 1
        vcpu: 4
        memory_gb: 16
        storage_gb: 300
        storage_type: ssd
  xl:
    label: Extra Large
    range_description: 150 to 400 MB/s ingress with longer retention and wider connector fan-out
    ref_arch_tier: large-cluster
    components:
      - role: broker
        count: 6
        vcpu: 32
        memory_gb: 128
        storage_gb: 8000
        storage_type: ssd
      - role: kraft-controller
        count: 5
        vcpu: 4
        memory_gb: 16
        storage_gb: 100
        storage_type: ssd
      - role: connect
        count: 4
        vcpu: 8
        memory_gb: 16
        storage_gb: 100
        storage_type: ssd
      - role: schema-registry
        count: 3
        vcpu: 2
        memory_gb: 8
        storage_gb: 50
        storage_type: ssd
      - role: control-center
        count: 2
        vcpu: 4
        memory_gb: 16
        storage_gb: 300
        storage_type: ssd
notes:
  - Confluent Platform 8.x runs Apache Kafka 4.x with mandatory KRaft metadata controllers (ZooKeeper has been completely removed).
  - Enabling Tiered Storage to S3, GCS, or Azure Blob can significantly shrink per-broker block disk sizes when retention exceeds 24-48 hours.
disclaimers:
  - Based on Confluent Platform 8.x self-managed production deployment guidance normalized to cloud VM shapes.
  - Estimate excludes Confluent Enterprise licensing, Apache Flink compute pools, Tiered Storage bucket capacity, and cross-AZ replication traffic charges.
