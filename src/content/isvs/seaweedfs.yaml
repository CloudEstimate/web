slug: seaweedfs
name: SeaweedFS Object Store
vendor: SeaweedFS Project
category: data-store
arch_support:
  - x86_64
  - arm64
description: >
  Open-source distributed file system and S3-compatible object store (Apache 2.0) built around O(1) disk-seek volume servers, Raft masters, and POSIX/S3 filers.
ref_arch:
  source_url: https://github.com/seaweedfs/seaweedfs/wiki/Production-Setup
  version: "SeaweedFS 3.80+ production Raft master, volume & S3 filer setup"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: 12 TB raw S3-compatible object and blob storage for small apps and backups
    ref_arch_tier: compact-raft-cluster
    components:
      - role: master-filer
        count: 3
        vcpu: 2
        memory_gb: 8
        storage_gb: 80
        storage_type: ssd
      - role: volume-server
        count: 3
        vcpu: 4
        memory_gb: 16
        storage_gb: 4000
        storage_type: hdd
    ha_components:
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
