slug: elasticsearch-oss
name: Elasticsearch Self-Managed
vendor: Elastic
category: search
arch_support:
  - x86_64
  - arm64
description: >
  Self-managed Elasticsearch 8.16+ / 9.x (AGPLv3 / Elastic License) for full-text search, log analytics, and hybrid vector retrieval.
ref_arch:
  source_url: https://www.elastic.co/guide/en/elasticsearch/reference/current/important-settings.html
  version: "Elasticsearch 9.x self-managed production settings (AGPLv3 restored in 8.16+)"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: up to 100 GB hot index data on a single node
    ref_arch_tier: single-node
    components:
      - role: node
        count: 1
        vcpu: 4
        memory_gb: 16
        storage_gb: 500
        storage_type: nvme
    ha_components:
      - role: node
        count: 2
        vcpu: 4
        memory_gb: 16
        storage_gb: 500
        storage_type: nvme
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
  m:
    label: Medium
    range_description: 100 GB to 1 TB hot data on a dedicated master cluster
    ref_arch_tier: dedicated-master-medium
    components:
      - role: data-node
        count: 3
        vcpu: 8
        memory_gb: 64
        storage_gb: 1000
        storage_type: nvme
      - role: master-node
        count: 3
        vcpu: 2
        memory_gb: 8
        storage_gb: 100
        storage_type: ssd
      - role: coordinating-node
        count: 2
        vcpu: 4
        memory_gb: 16
        storage_gb: 100
        storage_type: ssd
  xl:
    label: Extra Large
    range_description: 1 to 5 TB hot data on a scale-out search cluster
    ref_arch_tier: scale-out-large
    components:
      - role: data-node
        count: 6
        vcpu: 16
        memory_gb: 128
        storage_gb: 2000
        storage_type: nvme
      - role: master-node
        count: 3
        vcpu: 4
        memory_gb: 8
        storage_gb: 100
        storage_type: ssd
      - role: coordinating-node
        count: 2
        vcpu: 8
        memory_gb: 16
        storage_gb: 100
        storage_type: ssd
notes:
  - Elastic restored OSI-approved open-source licensing via AGPLv3 starting in Elasticsearch 8.16 alongside SSPL and Elastic License v2, keeping the URL slug elasticsearch-oss stable for existing bookmarks.
  - Hot data nodes use 1:8 memory-optimized instances (up to 31 GB JVM heap plus OS page cache) paired with high-IOPS SSD/NVMe storage.
disclaimers:
  - Based on Elastic's published self-managed heap, master quorum, and hot-tier operational guidance.
  - Estimate excludes Elastic commercial subscriptions, warm/cold/frozen searchable-snapshot tiers, Kibana hosts, ML nodes, and snapshot object storage.
