slug: cockroachdb-self-hosted
name: CockroachDB Self-Hosted
vendor: Cockroach Labs
category: data-store
arch_support:
  - x86_64
  - arm64
description: >
  Self-hosted CockroachDB v26.x for resilient distributed SQL workloads needing serializable transactions and multi-zone survivability.
ref_arch:
  source_url: https://www.cockroachlabs.com/docs/stable/recommended-production-settings
  version: "CockroachDB v26.x recommended production settings"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: up to 1 TB replicated OLTP data on a three-node quorum cluster
    ref_arch_tier: three-node-small
    components:
      - role: node
        count: 3
        vcpu: 4
        memory_gb: 16
        storage_gb: 500
        storage_type: ssd
    ha_components:
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
  m:
    label: Medium
    range_description: 1 to 5 TB replicated OLTP data on a five-node cluster
    ref_arch_tier: five-node-medium
    components:
      - role: node
        count: 5
        vcpu: 8
        memory_gb: 32
        storage_gb: 1000
        storage_type: ssd
    ha_components:
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
  xl:
    label: Extra Large
    range_description: 5 to 20 TB replicated data or high-concurrency regional SQL workloads
    ref_arch_tier: seven-node-large
    components:
      - role: node
        count: 7
        vcpu: 16
        memory_gb: 64
        storage_gb: 2000
        storage_type: nvme
    ha_components:
      - role: load-balancer
        count: 2
        vcpu: 0
        memory_gb: 0
notes:
  - CockroachDB requires a commercial license (or free tier registration within published scale thresholds) since the v24.3 CockroachDB Software License transition.
  - Multi-node Raft quorum is already built into the 3-, 5-, and 7-node base topologies; enabling HA adds managed L4 SQL load balancing across zones.
disclaimers:
  - Based on CockroachDB v26.x self-hosted production hardware recommendations (4 GB RAM per vCPU, up to ~2.5 TB logical capacity per node).
  - Estimate excludes CockroachDB Enterprise licensing, backup object storage, Kafka changefeed sinks, and cross-AZ/cross-region replication egress.
