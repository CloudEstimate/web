slug: redis-enterprise
name: Redis Enterprise
vendor: Redis Inc.
category: data-store
arch_support:
  - x86_64
  - arm64
description: >
  Self-managed Redis Enterprise Software (Redis 8 engine) for sub-millisecond caching, session stores, and real-time vector/JSON workloads.
ref_arch:
  source_url: https://redis.io/docs/latest/operate/rs/installing-upgrading/install/plan-deployment/hardware-requirements/
  version: "Redis Enterprise 7.22+ / Redis 8 hardware requirements"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: up to 50 GB working set
    ref_arch_tier: dev-small
    components:
      - role: cluster-node
        count: 1
        vcpu: 4
        memory_gb: 32
        storage_gb: 100
        storage_type: nvme
      - role: quorum-node
        count: 1
        vcpu: 2
        memory_gb: 8
        storage_gb: 50
        storage_type: ssd
    ha_components:
      - role: cluster-node
        count: 2
        vcpu: 4
        memory_gb: 32
        storage_gb: 100
        storage_type: nvme
  s:
    label: Small
    range_description: 50 to 200 GB working set
    ref_arch_tier: prod-small
    components:
      - role: cluster-node
        count: 3
        vcpu: 4
        memory_gb: 32
        storage_gb: 150
        storage_type: nvme
    ha_components:
      - role: cluster-node
        count: 2
        vcpu: 4
        memory_gb: 32
        storage_gb: 150
        storage_type: nvme
  m:
    label: Medium
    range_description: 200 to 500 GB working set
    ref_arch_tier: prod-medium
    components:
      - role: cluster-node
        count: 3
        vcpu: 8
        memory_gb: 64
        storage_gb: 400
        storage_type: nvme
    ha_components:
      - role: cluster-node
        count: 2
        vcpu: 8
        memory_gb: 64
        storage_gb: 400
        storage_type: nvme
  l:
    label: Large
    range_description: 500 GB to 1 TB working set
    ref_arch_tier: prod-large
    components:
      - role: cluster-node
        count: 5
        vcpu: 16
        memory_gb: 128
        storage_gb: 750
        storage_type: nvme
    ha_components:
      - role: cluster-node
        count: 2
        vcpu: 16
        memory_gb: 128
        storage_gb: 750
        storage_type: nvme
  xl:
    label: Extra Large
    range_description: 1 to 2 TB working set
    ref_arch_tier: prod-xl
    components:
      - role: cluster-node
        count: 5
        vcpu: 32
        memory_gb: 256
        storage_gb: 1500
        storage_type: nvme
    ha_components:
      - role: cluster-node
        count: 2
        vcpu: 32
        memory_gb: 256
        storage_gb: 1500
        storage_type: nvme
notes:
  - Cluster data nodes map to 1:8 memory-optimized instances to reflect RAM-bound shard sizing, with high-IOPS NVMe/SSD persistence for AOF and Auto Tiering (Redis on Flash).
  - Note that Redis 8.0+ offers AGPLv3 open-source licensing for Community Edition alongside commercial Redis Enterprise Software subscriptions; see Valkey for the BSD-3 Linux Foundation fork.
disclaimers:
  - Based on Redis Enterprise published hardware requirements normalized to cloud VM shapes.
  - Estimate excludes commercial Redis Enterprise shard licensing, Active-Active geo-replication, backup buckets, and cross-zone network transfer.
