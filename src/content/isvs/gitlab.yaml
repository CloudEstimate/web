notes:
  - GitLab 18.x reference architectures split compute-heavy Rails webservice nodes (1:2 vCPU-to-RAM) from background Sidekiq workers, memory-heavy PostgreSQL nodes, NVMe-backed Gitaly storage, and native cloud object buckets for artifacts, LFS, and registry blobs.
  - CI/CD runner fleets are intentionally excluded because runner concurrency depends on pipeline minutes rather than user seat count.
disclaimers:
  - Based on GitLab 18.x published reference architectures (1K through 25K users) normalized to VM-backed Linux Package / Hybrid footprints.
  - Estimate excludes GitLab Ultimate/Premium licensing, CI/CD runner pools, OpenSearch Advanced Search nodes, GitLab Duo AI add-ons, and backup storage.

