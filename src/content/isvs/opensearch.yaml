slug: opensearch
name: OpenSearch
vendor: OpenSearch Software Foundation
category: search
arch_support:
  - x86_64
  - arm64
description: >
  Self-managed OpenSearch 3.x (Linux Foundation Apache 2.0) for full-text search, log analytics, and vector search pipelines.
ref_arch:
  source_url: https://docs.opensearch.org/docs/latest/tuning-your-cluster/
  version: "OpenSearch 3.x cluster tuning and sizing guidance"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: up to 100 GB hot index data on a single node
    ref_arch_tier: single-node
    components:
      - role: node
        count: 1
        vcpu: 4
        memory_gb: 16
        storage_gb: 500
        storage_type: nvme
    ha_components:
      - role: node
        count: 2
        vcpu: 4
        memory_gb: 16
        storage_gb: 500
        storage_type: nvme
      - role: load-balancer
        count: 1
        vcpu: 0
        memory_gb: 0
  m:
    label: Medium
    range_description: 100 GB to 1 TB hot data on a cluster with dedicated cluster managers
    ref_arch_tier: dedicated-cluster-manager-medium
    components:
      - role: data-node
        count: 3
        vcpu: 8
        memory_gb: 64
        storage_gb: 1000
        storage_type: nvme
      - role: cluster-manager
        count: 3
        vcpu: 2
        memory_gb: 8
        storage_gb: 100
        storage_type: ssd
      - role: coordinating-node
        count: 2
        vcpu: 4
        memory_gb: 16
        storage_gb: 100
        storage_type: ssd
  xl:
    label: Extra Large
    range_description: 1 to 5 TB hot data on a scale-out search and vector cluster
    ref_arch_tier: scale-out-large
    components:
      - role: data-node
        count: 6
        vcpu: 16
        memory_gb: 128
        storage_gb: 2000
        storage_type: nvme
      - role: cluster-manager
        count: 3
        vcpu: 4
        memory_gb: 8
        storage_gb: 100
        storage_type: ssd
      - role: coordinating-node
        count: 2
        vcpu: 8
        memory_gb: 16
        storage_gb: 100
        storage_type: ssd
notes:
  - Governed under the Linux Foundation's OpenSearch Software Foundation, OpenSearch 3.x (Lucene 10) benefits strongly from memory-optimized 1:8 data nodes and Linux arm64 instances.
  - Cluster-manager quorum and coordinating roles are separated from hot data nodes at Medium and Extra Large tiers.
disclaimers:
  - Based on OpenSearch 3.x official cluster tuning guidance normalized to cloud VM shapes.
  - Estimate excludes OpenSearch Dashboards hosts, Data Prepper ingestion fleets, warm/cold remote-backed storage, and snapshot buckets.
