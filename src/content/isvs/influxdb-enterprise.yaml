slug: influxdb-enterprise
name: InfluxDB Enterprise
vendor: InfluxData, Inc.
category: data-store
arch_support:
  - x86_64
description: >
  Self-managed InfluxDB Enterprise for high-ingest time-series telemetry, operational monitoring, and sensor analytics.
ref_arch:
  source_url: https://docs.influxdata.com/enterprise_influxdb/v1/guides/hardware_sizing/
  version: "InfluxDB Enterprise v1 TSM sizing (with InfluxDB 3 Enterprise FDAP context)"
  retrieved_date: "2026-11-11"
sizes:
  xs:
    label: Extra Small
    range_description: up to 100,000 writes per second and under 1 million series
    ref_arch_tier: small-rf2
    components:
      - role: meta-node
        count: 3
        vcpu: 2
        memory_gb: 8
        storage_gb: 50
        storage_type: ssd
      - role: data-node
        count: 2
        vcpu: 4
        memory_gb: 16
        storage_gb: 1000
        storage_type: ssd
  m:
    label: Medium
    range_description: 100,000 to 400,000 writes per second and 1 to 5 million series
    ref_arch_tier: medium-rf2
    components:
      - role: meta-node
        count: 3
        vcpu: 2
        memory_gb: 8
        storage_gb: 50
        storage_type: ssd
      - role: data-node
        count: 4
        vcpu: 8
        memory_gb: 32
        storage_gb: 2000
        storage_type: ssd
  xl:
    label: Extra Large
    range_description: 400,000 to 750,000+ writes per second and 5 to 10 million+ series
    ref_arch_tier: large-rf3
    components:
      - role: meta-node
        count: 5
        vcpu: 2
        memory_gb: 8
        storage_gb: 50
        storage_type: ssd
      - role: data-node
        count: 6
        vcpu: 16
        memory_gb: 64
        storage_gb: 4000
        storage_type: ssd
notes:
  - These tiers model the stateful v1 TSM meta-and-data-node topology; teams adopting InfluxDB 3 Enterprise (Apache Arrow / Parquet on object storage) typically shift long-term retention from local SSDs to S3/GCS/Blob object storage.
  - Meta nodes remain compact odd-numbered Raft quorums while data nodes scale out in pairs to preserve replication factor balance.
disclaimers:
  - Based on InfluxDB Enterprise v1 published hardware sizing guidelines normalized to cloud VM shapes.
  - Estimate excludes commercial InfluxDB Enterprise or InfluxDB 3 Enterprise licensing, object-store retention tiers, Kapacitor, and cross-zone network transfer.
